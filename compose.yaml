services:
  lunchly:
    image: lunchly:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      # Bind on all host interfaces so this continues to work after moving
      # the container to a host with a different LAN address.
      - "5000:5000"
    environment:
      PORT: "5000"
      LUNCHLY_DATA_DIR: /app/data
      LUNCHLY_HOST: "0.0.0.0"
      LUNCHLY_DISABLE_HTTPS: "1"
      TZ: Europe/Copenhagen
    volumes:
      - type: bind
        source: ./data
        target: /app/data
