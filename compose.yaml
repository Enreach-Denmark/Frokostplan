services:
  lunchly:
    image: lunchly:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      # Public host address/port for Lunchly. The container still listens on 5000.
      - "192.168.11.154:3005:5000"
    environment:
      PORT: "5000"
      LUNCHLY_DATA_DIR: /app/data
      LUNCHLY_HOST: "0.0.0.0"
      LUNCHLY_DISABLE_HTTPS: "1"
      TZ: Europe/Copenhagen
    volumes:
      - type: bind
        source: ./data
        target: /app/data
