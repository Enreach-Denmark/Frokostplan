<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunchly — Team lunch planning</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">✳</span><span>lunchly<span class="brand-dot">.</span></span></div>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">▦</span> Overview</button>
        <button class="nav-item" data-view="schedule"><span class="nav-icon">▤</span> Weekly plan</button>
        <button class="nav-item" data-view="requests"><span class="nav-icon">⇄</span> Swap requests <span id="nav-count" class="nav-count hidden"></span></button>
        <button class="nav-item" data-view="admin"><span class="nav-icon">⚙</span> Admin settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-note"><span>✦</span><strong>Lunch works better together.</strong><small>Keep everyone in sync, one week at a time.</small></div>
        <div class="profile"><div class="avatar" id="side-avatar">AC</div><div><strong id="side-name">Alex Chen</strong><small id="side-role">Employee</small><button class="text-link recovery-link" data-action="open-recovery">Recovery phrase</button></div><button class="profile-more logout-button" data-action="logout" title="Sign out" aria-label="Sign out">↪</button></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="breadcrumb-current">Overview</strong></div><div class="top-actions"><span class="today-label" id="today-label"></span><button class="icon-button" id="notification-button" aria-label="View swap requests">♧<i id="notification-dot" class="notification-dot hidden"></i></button></div></header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
